[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hevy-mcp"
version = "0.1.0"
description = "Sync Hevy workouts into Træning.xlsx, from the terminal or via MCP."
requires-python = ">=3.11"
dependencies = [
    # <2 on purpose: mcp 2.0 replaced FastMCP with MCPServer, which server.py
    # is not written against. Porting is a separate job; until then, pin.
    "mcp[cli]>=1.0,<2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hevy-mcp = "hevy_mcp.server:main"
hevy = "hevy_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hevy_mcp*"]
